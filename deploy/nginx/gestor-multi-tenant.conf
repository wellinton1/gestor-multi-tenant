# Nginx — Painel de Gestao Multi-Tenant (proxy reverso producao)
#
# Como usar:
#   1) Copie este arquivo para /etc/nginx/sites-available/gestor-multi-tenant
#      trocando __DOMAIN__ e __APP_PORT__ (o scripts/setup-nginx.sh faz isso sozinho).
#   2) Para HTTP via IP (sem dominio ainda): server_name _;
#   3) Com dominio: server_name painel.seudominio.com; + certbot --nginx -d ...
#
# O app Node roda em 127.0.0.1:__APP_PORT__ (systemd). O Nginx atende na porta 80
# e, apos o Certbot, tambem na 443 com redirect automatico.

upstream gestor_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    # Uploads/backup .zip: o Express aceita ate 50mb (express.json limit).
    client_max_body_size 55m;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # Gzip: HTML/CSS/JS puro do painel comprime muito bem.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Headers de seguranca na borda (o Helmet do Express ja manda os dele;
    # estes aqui cobrem respostas estaticas e erros do proprio Nginx).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: ATENCAO — so ative com HTTPS real. O Certbot nao adiciona sozinho;
    # descomente a linha abaixo DEPOIS de confirmar https:// funcionando.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Logs separados por vhost (facilita debug: tail -f /var/log/nginx/gestor-*).
    access_log /var/log/nginx/gestor-multi-tenant-access.log;
    error_log /var/log/nginx/gestor-multi-tenant-error.log warn;

    location / {
        proxy_pass http://gestor_app;
        proxy_http_version 1.1;

        # WebSocket / upgrade (futuro: realtime). Sem estas 2 linhas o upgrade quebra.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Health-check barato p/ monitoramento (responde sem bater no Node).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
